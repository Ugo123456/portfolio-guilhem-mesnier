/* Les réglages du lecteur : largeur, hauteur et mode lecture. */
#lecteur .l-outils{display:flex;align-items:center;gap:6px;flex:none}
#lecteur .l-bt{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:99px;border:1px solid var(--trait,rgba(255,255,255,.2));background:transparent;color:inherit;font:600 13px var(--pf,"Figtree"),sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
#lecteur .l-bt svg{width:16px;height:16px;flex:none}
#lecteur .l-bt .c{display:none}
#lecteur .l-bt:hover{background:var(--carte,rgba(255,255,255,.08))}
#lecteur .l-bt[aria-pressed="true"]{background:var(--texte,#fff);color:var(--fond,#111);border-color:transparent}
#lecteur .l-bt.l-taille{display:none;width:38px;padding:0;justify-content:center;font-size:14px}
#lecteur.l-largeur{padding-left:0;padding-right:0}
#lecteur.l-largeur .fen{width:100%;border-radius:0;border-left:0;border-right:0}
#lecteur.l-largeur .texte>*{max-width:1080px}
#lecteur.l-hauteur{padding-top:0;padding-bottom:0}
#lecteur.l-hauteur .fen{max-height:none;border-radius:0;border-top:0;border-bottom:0}
#lecteur.l-lecture{--fond:#fbf8f1!important;--texte:#23201a!important;--doux:#5d574b!important;--acc:#8a5a14!important;--carte:rgba(60,45,20,.06)!important;--trait:rgba(60,45,20,.16)!important;--tf:"New York",ui-serif,"Iowan Old Style",Georgia,serif!important;--pf:-apple-system,"Segoe UI",Roboto,sans-serif!important;--tw:700!important;padding:0}
#lecteur.l-lecture .voile{background:#fbf8f1}
#lecteur.l-lecture .fen{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
#lecteur.l-lecture nav{display:none!important}
#lecteur.l-lecture .texte{font-family:"New York",ui-serif,"Iowan Old Style",Georgia,serif;font-size:calc(20px*var(--lz,1));line-height:1.72;padding-top:clamp(28px,6vh,72px)}
#lecteur.l-lecture .texte>*{max-width:680px}
#lecteur.l-lecture .l-bt[data-lm="largeur"],#lecteur.l-lecture .l-bt[data-lm="hauteur"]{display:none}
#lecteur.l-lecture .l-bt.l-taille{display:inline-flex}
#lecteur.l-lecture .btn.verre{color:#23201a;border-color:rgba(60,45,20,.3);background:transparent}
@media (max-width:1100px){#lecteur .l-bt .l{display:none}#lecteur .l-bt .c{display:inline}}
@media (max-width:860px){#lecteur .l-bt[data-lm="largeur"],#lecteur .l-bt[data-lm="hauteur"]{display:none}#lecteur .haut{padding:10px 12px 10px 16px;gap:8px}}
body.clair{--pale:#5a5f6e}
.page-travail.hab-clair .blocs small{color:var(--doux)}
.ecrin .boutons{justify-content:center}
.page-travail.hab[data-s="boz"] .ecrin .sous{background:rgba(120,8,14,.82);border-radius:14px;padding:6px 12px;width:fit-content;margin-inline:auto;color:#fff}
/* le verre passe sur un calque : sinon le menu fixe du téléphone reste enfermé dans la barre du haut */
#barre{backdrop-filter:none;-webkit-backdrop-filter:none}
#barre::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;backdrop-filter:blur(16px) saturate(185%);-webkit-backdrop-filter:blur(16px) saturate(185%);pointer-events:none}

/* version 7 : le diaporama tient toujours dans la fenêtre visible */
.diaporama{--dp-h:clamp(170px,min(calc(100vh - 220px),50vw),760px);border-radius:calc(var(--br,14px) + 12px);padding:clamp(8px,1.1vw,14px);background:color-mix(in srgb,var(--acc,#fff) 10%,var(--p1,#10141f));border:1px solid color-mix(in srgb,var(--acc,#fff) 34%,transparent);box-shadow:0 26px 50px -26px rgba(0,0,0,.75)}
.dp-scene{position:relative;height:var(--dp-h);border-radius:calc(var(--br,14px) + 4px);overflow:hidden}
.dp-piste{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;outline:none}
.dp-piste::-webkit-scrollbar{display:none}
.dp-piste img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always;cursor:zoom-in;border-radius:0}
.dp-fl{position:absolute;top:50%;translate:0 -50%;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--bbg,#fff);color:var(--bfg,#111);border:0;box-shadow:0 8px 20px -6px rgba(0,0,0,.6);transition:opacity .2s,scale .2s}
.dp-fl svg{width:20px;height:20px}.dp-fl.g{left:12px}.dp-fl.d{right:12px}.dp-fl:hover{scale:1.08}.dp-fl:disabled{opacity:0;pointer-events:none}
.dp-bas{display:flex;align-items:center;gap:16px;padding:12px 8px 4px;color:var(--texte,#fff)}
.dp-compte{font-family:var(--tf,"Sora");font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}.dp-compte b{font-size:19px}
.dp-jauge{flex:1;height:4px;border-radius:9px;overflow:hidden;background:color-mix(in srgb,var(--texte,#fff) 16%,transparent)}.dp-jauge i{display:block;height:100%;border-radius:inherit;background:var(--acc,#fff);transition:width .3s}
.dp-grand{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:9px 16px;background:var(--bbg,#fff);color:var(--bfg,#111);border:0;border-radius:var(--br,999px);font:600 13.5px var(--pf,"Figtree"),sans-serif;white-space:nowrap}
.dp-grand svg{width:15px;height:15px}
@media (max-width:640px){.dp-fl{width:36px;height:36px}.dp-fl.g{left:6px}.dp-fl.d{right:6px}}
/* rien d'autre ne dépasse non plus la hauteur de la fenêtre */
.page-travail.hab .defile.pages{grid-auto-columns:min(31.6%,460px,calc((100vh - 190px)*.707))}
@media (min-width:821px){.juste{max-width:calc((100vh - 170px)*var(--r,99));margin-inline:auto}}
.video-bloc video,.yt,.seule .net{max-height:calc(100vh - 170px)}
/* la barre reste lisible même au-dessus d'une diapositive blanche */
#barre,#barre.bas,body.sur-clair #barre{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 45%,rgba(255,255,255,.09)),rgba(26,26,28,.6)}
body.clair #barre,body.clair #barre.bas{background:rgba(255,255,255,.96)}

/* ================= version 8 ================= */
/* la barre : elle épouse son contenu, contour marqué, ombre légère */
#barre{width:fit-content;max-width:calc(100vw - 32px);height:50px;gap:16px;padding:0 14px 0 20px;border:1.5px solid rgba(255,255,255,.3);box-shadow:0 10px 30px -8px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35)}
#barre .marque img{height:32px}
#menu{flex:none}
#menu a{padding:7px 11px}
#menu a .long{display:none}#menu a .court{display:inline}
body.clair #barre{border-color:rgba(10,14,34,.2);box-shadow:0 10px 26px -10px rgba(10,14,34,.32),0 2px 6px rgba(10,14,34,.12)}
@media (max-width:1000px){#menu a svg{display:none}}
@media (max-width:820px){#barre{width:calc(100vw - 24px);max-width:none;padding:0 10px 0 16px}#menu a svg{display:block}#menu a[href="#/playlists"]{display:none}}
/* collections et playlists : tout est centré */
.grille-affiches{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:1180px;margin:0 auto;padding:22px var(--g) 10px}
.grille-affiches>*{flex:0 1 calc((100% - 60px)/4);min-width:0}
@media (max-width:760px){.grille-affiches{gap:14px}.grille-affiches>*{flex-basis:calc((100% - 14px)/2)}}
.onglets-cp{display:inline-flex;gap:4px;margin-top:20px;padding:4px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24)}
.onglets-cp a{padding:8px 18px;border-radius:999px;font:600 13.5px "Sora",sans-serif;color:#fff}
.onglets-cp a.on{background:#fff;color:#10141f}
/* les pages de travaux : moins de vide, les numéros à la taille des titres, les ancres sous la barre */
.page-travail.hab{--ecart:clamp(40px,5vw,72px)}
.bloc,.tout,#consigne{scroll-margin-top:96px}
.page-travail.hab .bloc .num{font-family:var(--tf),"Sora",sans-serif;font-weight:var(--tw);font-style:var(--ti);font-size:calc(clamp(24px,2.8vw,38px)*var(--tfs));letter-spacing:0;line-height:1.15;color:var(--acc)}
.page-travail.hab .ecrin .meta .puce{box-shadow:0 4px 14px -4px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4)}
.voir-aussi,.voir-aussi *{font-family:"Sora",sans-serif!important;font-style:normal!important;letter-spacing:normal}
.voir-aussi h2{font-weight:600!important;font-size:clamp(20px,2vw,26px)!important;text-transform:none!important}
/* les ombres ne sont plus coupées net par les zones qui défilent */
.defile{padding:6px 24px 56px;margin:0 -24px -34px}
.piste{padding-bottom:46px;margin-bottom:-30px}
/* le cadre du diaporama : arrondi raisonnable, jamais d'ovale */
.diaporama{border-radius:22px}
.dp-scene{border-radius:14px}
.dp-grand{border-radius:min(var(--br,999px),999px)}
/* la vidéo : le texte à gauche, le lecteur à droite, entière dans la fenêtre */
.duo{display:grid;grid-template-columns:minmax(220px,.38fr) minmax(0,1fr);gap:clamp(24px,3.4vw,52px);align-items:center}
.duo-txt .tete-bloc{display:block;margin-bottom:12px}
.duo-txt .tete-bloc .num{display:block}
.duo-txt .compte{display:block;margin-top:6px}
.duo-txt .chapo{margin-bottom:0}
.duo-media{min-width:0;width:100%;max-width:calc((100vh - 240px)*1.778 + 28px);justify-self:end}
@media (max-width:860px){.duo{grid-template-columns:minmax(0,1fr)}.duo-media{max-width:none}}
.cadre-video .dp-scene{height:auto;aspect-ratio:16/9;background:#000}
.cadre-video video{display:block;width:100%;height:100%;object-fit:contain}
.cadre-video .dp-bas{justify-content:flex-end;padding-bottom:2px}
.voir-yt{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--pf,"Figtree"),sans-serif;color:var(--texte,#fff)}
.voir-yt svg{width:18px;height:18px;color:var(--acc,#ff0000)}
.voir-yt:hover{text-decoration:underline;text-underline-offset:3px}
.sous-video{display:flex;justify-content:flex-end;margin-top:12px}
.agrandir{position:absolute;top:12px;right:12px;z-index:4;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:0;cursor:pointer;border-radius:min(var(--br,999px),999px);background:var(--bbg,#fff);color:var(--bfg,#111);font:600 12.5px var(--pf,"Figtree"),sans-serif;box-shadow:0 8px 20px -6px rgba(0,0,0,.6);transition:scale .2s}
.agrandir:hover{scale:1.05}
.agrandir svg{width:14px;height:14px}
.agrandir.rondi{padding:9px;top:10px;right:10px}
.carte-debout figcaption{padding-right:52px}
/* un document feuilleté sur toute la largeur */
.pile-doc{position:relative;display:flex;height:clamp(300px,calc(100vh - 280px),600px);padding-left:14px}
.pile-doc>button:not(.agrandir){all:unset;position:relative;flex:1 1 0;min-width:0;margin-left:-14px;overflow:hidden;cursor:zoom-in;background:#fff;border-radius:18px;box-shadow:-10px 0 22px -12px rgba(0,0,0,.45);transition:flex-grow .45s cubic-bezier(.2,.8,.2,1)}
.pile-doc>button:not(.agrandir):hover,.pile-doc>button:not(.agrandir):focus-visible{flex-grow:5}
.pile-doc>button:not(.agrandir):focus-visible{outline:3px solid var(--acc,#fff);outline-offset:-3px}
.pile-doc>button img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;border-radius:0;box-shadow:none}
.pile-doc>button i{position:absolute;left:10px;bottom:10px;min-width:26px;height:26px;padding:0 6px;box-sizing:border-box;display:grid;place-items:center;border-radius:13px;font:700 12px var(--pf,"Figtree"),sans-serif;background:var(--bbg,#fff);color:var(--bfg,#111)}
@media (max-width:820px){.pile-doc{display:block;height:auto;padding:14px 0 0}.pile-doc>button:not(.agrandir){display:block;height:clamp(84px,24vw,120px);margin:-14px 0 0;box-shadow:0 -10px 20px -12px rgba(0,0,0,.45)}.pile-doc>button:not(.agrandir):last-of-type{height:56vw}.pile-doc>button img{width:100%;height:auto}}
/* les vignettes de « Voir tout le travail » : l'image entière, le texte dessous */
.carte-etape{aspect-ratio:auto;display:flex;flex-direction:column;background:var(--carte);color:var(--texte)}
.carte-etape::after{display:none}
.carte-etape .ce-im{position:relative;left:auto;right:auto;bottom:auto;display:block;flex:none;aspect-ratio:16/10;overflow:hidden;background:var(--p2)}
.carte-etape .ce-im img{position:absolute;background:none}
.carte-etape .ce-im .f{inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(16px) brightness(.8)}
.carte-etape .ce-im .n{inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);object-fit:contain}
.carte-etape .ce-tx{position:static;display:grid;gap:3px;padding:12px 14px 14px;color:var(--texte)}
.carte-etape .ce-tx small{color:var(--doux);font-size:13px}
.cartes-etapes.peu{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),340px))}
.cartes-etapes.peu .carte-etape{aspect-ratio:auto}
/* sur téléphone, les vidéos debout s'enchaînent l'une sous l'autre */
@media (max-width:820px){.cartes-debout{display:grid;grid-template-columns:minmax(0,1fr);overflow:visible;margin-right:0;padding-right:0;gap:20px}.carte-debout{flex:none;width:min(100%,380px);margin-inline:auto}}
/* la fenêtre flottante : sommaire à gauche, boutons en haut à droite, charte du travail */
#visio{z-index:300}
#visio .fenetre{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);isolation:isolate}
#visio.portrait .fenetre{width:min(1180px,100%)}
#visio .haut{grid-column:1/-1;grid-row:1}
#visio .scene{grid-column:2;grid-row:2}
#visio .fl{grid-column:2;grid-row:2}
#visio .miniatures{grid-column:1;grid-row:2;flex-direction:column;width:172px;box-sizing:border-box;overflow:hidden auto;padding:14px 12px;border-top:0;border-right:1px solid rgba(255,255,255,.08);counter-reset:p}
#visio.portrait .miniatures{width:118px}
#visio .miniatures button,#visio.portrait .miniatures button{position:relative;width:100%;counter-increment:p}
#visio .miniatures button::after{content:counter(p);position:absolute;left:4px;bottom:4px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;display:grid;place-items:center;border-radius:9px;font:700 10.5px "Sora",sans-serif;color:#fff;background:rgba(0,0,0,.62)}
#visio .scene video{display:none}
#visio.video .scene img{display:none}
#visio.video .scene video{display:block;position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;border-radius:12px}
#visio.video .zoom{display:none}
#visio.video .fenetre{width:min(1400px,100%);height:auto;aspect-ratio:16/10;max-height:100%}
#visio.sans-plein:not(.video) .plein-ecran{display:none}
.yt-haut{font:600 13px var(--pf,"Figtree"),sans-serif;color:inherit;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
#visio [data-fit].on{background:var(--bbg,#fff);color:var(--bfg,#111)}
#visio.hab .fenetre{background:linear-gradient(170deg,var(--p1),var(--p2) 60%,var(--p3));color:var(--texte);border-color:var(--trait)}
#visio.hab .fenetre::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--motif);background-size:var(--mt) auto;opacity:var(--mo);pointer-events:none}
#visio.hab .haut{border-bottom-color:var(--trait)}
#visio.hab .haut b{font-family:var(--tf),"Sora",sans-serif;font-weight:var(--tw);font-style:var(--ti);font-size:calc(17px*var(--tfs));color:var(--texte)}
#visio.hab .haut small,#visio.hab .zv{color:var(--doux);font-family:var(--pf),"Figtree",sans-serif}
#visio.hab .rond{background:color-mix(in srgb,var(--texte) 9%,transparent);color:var(--texte);border:1px solid var(--trait)}
#visio.hab .rond:hover,#visio.hab [data-fit].on{background:var(--bbg);color:var(--bfg);border-color:transparent}
#visio.hab .fl{background:var(--bbg);color:var(--bfg);border:0;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
#visio.hab .miniatures{border-right-color:var(--trait)}
#visio.hab .miniatures button{opacity:.72}
#visio.hab .miniatures button.on,#visio.hab .miniatures button:hover{opacity:1;outline-color:var(--acc)}
body.clair #visio:not(.hab) .fenetre{background:linear-gradient(180deg,#fff,#efece6);border-color:rgba(0,0,0,.12)}
body.clair #visio:not(.hab) .haut,body.clair #visio:not(.hab) .miniatures{border-color:rgba(0,0,0,.1)}
body.clair #visio:not(.hab) .miniatures button.on,body.clair #visio:not(.hab) .miniatures button:hover{outline-color:#14161c}
/* troisième temps : le vrai plein écran, les outils s'effacent quand la souris se repose */
#visio .fenetre.plein{width:100%;height:100%;max-height:none;aspect-ratio:auto;border:0;border-radius:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#visio .plein .haut{position:absolute;inset:0 0 auto;z-index:5;background:color-mix(in srgb,var(--p1,#10141f) 88%,transparent);transition:opacity .3s}
#visio .plein .scene,#visio .plein .fl{grid-column:1;grid-row:1}
#visio .plein .fl{transition:opacity .3s}
#visio .plein .miniatures{display:none}
#visio .plein .scene img{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
#visio .plein.calme{cursor:none}
#visio .plein.calme .haut,#visio .plein.calme .fl{opacity:0;pointer-events:none}
@media (max-width:820px){
 #visio .fenetre{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
 #visio .scene,#visio .fl{grid-column:1;grid-row:2}
 #visio .miniatures,#visio.portrait .miniatures{grid-column:1;grid-row:3;flex-direction:row;width:auto;overflow:auto hidden;padding:10px 12px;border-right:0;border-top:1px solid var(--trait,rgba(255,255,255,.08))}
 #visio .miniatures button,#visio.portrait .miniatures button{width:64px}
 #visio.portrait .miniatures button{width:44px}
 #visio .scene img{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
 #visio .fl{top:auto;bottom:10px;transform:none;width:42px;height:42px}
 #visio.video .fenetre{height:100%;aspect-ratio:auto}
}
@media (max-width:520px){#visio .haut{padding-left:14px}#visio .haut .rond{width:34px;height:34px}}
/* on n'enregistre pas les images par glissé ni par appui long */
img,video{-webkit-touch-callout:none;-webkit-user-drag:none}

.reseaux{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

.ap-heros{position:relative;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center;margin:clamp(84px,9vw,110px) var(--g) 0;padding:clamp(28px,5vw,64px);border-radius:30px;overflow:hidden;color:#fff;background:radial-gradient(70% 120% at 88% 0,rgba(226,190,120,.34),transparent 62%),radial-gradient(70% 130% at 0 100%,rgba(34,184,207,.42),transparent 66%),linear-gradient(135deg,#0b2240,#0e3f56 58%,#123a4a);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.ap-heros.contact{grid-template-columns:minmax(0,1fr) auto}
.ap-portrait{width:clamp(170px,22vw,300px);aspect-ratio:1;border-radius:50%;padding:7px;background:linear-gradient(140deg,#e2be78,#22b8cf 60%,#e2be78);box-shadow:0 26px 50px -20px rgba(0,0,0,.8)}
.ap-portrait img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.ap-sur{font:600 13px "Sora",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e2be78}
.ap-heros h1{font:700 clamp(34px,5.2vw,68px)/1.05 "Sora",sans-serif;margin:10px 0 14px;color:#fff}

.ap-puces{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.ap-puces span{padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}
.ap-heros .boutons{display:flex;flex-wrap:wrap;gap:10px}
.ap-heros .btn.verre{color:#fff;border-color:rgba(255,255,255,.4)}
.ap-pap{width:clamp(110px,16vw,210px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.ap-bref{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 var(--g);margin-top:26px}
.ap-bref article,.savoirs article,.contact-direct article,.reseaux-grands a,.carte-h{background:var(--carte);border-radius:22px;padding:clamp(18px,2vw,26px);box-shadow:0 18px 34px -24px rgba(0,0,0,.5)}
.ap-bref h2{font:600 clamp(18px,1.6vw,22px) "Sora",sans-serif;margin-bottom:8px}
.ap-bref p,.savoirs p,.carte-h p{color:var(--doux);line-height:1.6;font-size:15.5px}
.ap-section{padding:0 var(--g);margin-top:clamp(44px,6vw,76px)}
.ap-titre{font:700 clamp(26px,3vw,40px) "Sora",sans-serif;margin-bottom:8px}
.ap-intro{color:var(--doux);margin-bottom:20px}
.histoire{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:14px;position:relative}
.histoire::before{content:"";position:absolute;left:138px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,#e2be78,#22b8cf)}
.histoire li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:40px;align-items:start}
.histoire .date{position:relative;font:600 14px/1.3 "Sora",sans-serif;text-align:right;padding-top:18px;color:var(--texte)}
.histoire .date::after{content:"";position:absolute;right:-26px;top:21px;width:14px;height:14px;border-radius:50%;background:#e2be78;box-shadow:0 0 0 4px color-mix(in srgb,#e2be78 28%,transparent)}
.carte-h h3{font:600 clamp(17px,1.5vw,21px) "Sora",sans-serif;margin-bottom:6px}
.carte-h a{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;font-size:14px;color:var(--texte);text-decoration:underline;text-underline-offset:3px}
.carte-h a svg{width:14px;height:14px}
.savoirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
.savoirs h3{font:600 clamp(18px,1.6vw,22px) "Sora",sans-serif;margin-bottom:8px}
.savoirs .tags{padding:0;margin-top:14px}
.outils-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
.outils-grille span{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--carte);font-size:14px;font-weight:600}
.outils-grille img{width:30px;height:30px;object-fit:contain;border-radius:7px}
.ap-fin{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin:clamp(44px,6vw,76px) var(--g) 0;padding:clamp(22px,3vw,36px);border-radius:24px;color:#fff;background:linear-gradient(120deg,#0b2240,#0e5468)}
.ap-fin h2{font:600 clamp(20px,2.2vw,30px) "Sora",sans-serif;color:#fff}
.contact-direct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:0 var(--g);margin-top:22px}
.contact-direct h2{font:600 15px "Sora",sans-serif;color:var(--doux);margin:14px 0 4px}
.contact-direct .valeur{display:block;font:700 clamp(19px,2.2vw,30px) "Sora",sans-serif;overflow-wrap:anywhere;color:var(--texte)}
.contact-direct .boutons{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.reseaux-grands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.reseaux-grands a{display:grid;gap:8px;align-content:start;color:var(--texte);transition:transform .25s}
.reseaux-grands a:hover{transform:translateY(-4px)}
.reseaux-grands b{font:600 18px "Sora",sans-serif;margin-top:6px}
.reseaux-grands small{color:var(--doux);font-size:14px;line-height:1.5}
@media (max-width:980px){.reseaux-grands{grid-template-columns:repeat(2,minmax(0,1fr))}.ap-bref{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.ap-heros,.ap-heros.contact{grid-template-columns:minmax(0,1fr);justify-items:start}.ap-pap{display:none}.savoirs,.contact-direct{grid-template-columns:minmax(0,1fr)}.histoire::before{left:6px}.histoire li{grid-template-columns:minmax(0,1fr);gap:8px;padding-left:26px}.histoire .date{text-align:left;padding-top:0}.histoire .date::after{right:auto;left:-26px;top:2px}}
@media (max-width:420px){.reseaux-grands{grid-template-columns:minmax(0,1fr)}}


/* ================= version 8, corrections de l'après-midi ================= */
/* la barre : du verre neutre, façon Apple, sans teinte */
#barre{border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 28px -10px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.08)}
#barre::before{backdrop-filter:blur(20px) saturate(135%);-webkit-backdrop-filter:blur(20px) saturate(135%)}
@media (max-width:820px){#menu{background:rgba(26,26,28,.94)}#menu a .et{display:none}}
/* le zoom */
#visio .scene.zoome{display:flex;overflow:auto;padding:18px;box-sizing:border-box;cursor:grab}
#visio .scene.zoome.tire{cursor:grabbing;user-select:none;-webkit-user-select:none}
#visio .scene.zoome img,#visio.long .scene.zoome img{position:static;flex:none;margin:auto;width:var(--w);height:auto;max-width:none;filter:none;border-radius:6px}
#visio .plein .scene.zoome{padding-top:76px}
@media (max-width:820px){#visio .scene.zoome{padding:10px}}
#visio .ajuste{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font:600 13px var(--pf,"Figtree"),sans-serif;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);transition:background .2s,color .2s}
#visio .ajuste svg{width:15px;height:15px;flex:none}
#visio .ajuste .c{display:none}
#visio .ajuste:hover{background:rgba(255,255,255,.18)}
#visio .ajuste.on,#visio .ajuste.on:hover{background:var(--bbg,#fff);color:var(--bfg,#111);border-color:transparent}
#visio.hab .ajuste{color:var(--texte);background:color-mix(in srgb,var(--texte) 9%,transparent);border-color:var(--trait);border-radius:min(var(--br,999px),999px)}
#visio.hab .ajuste:hover{background:color-mix(in srgb,var(--texte) 18%,transparent)}
#visio.hab .ajuste.on,#visio.hab .ajuste.on:hover{background:var(--bbg);color:var(--bfg);border-color:transparent}
#visio .zoom [data-z]{margin-left:4px}
#visio .zoom [data-z="1"]{margin-left:0}
@media (max-width:1000px){#visio .ajuste .l{display:none}#visio .ajuste .c{display:inline}}
@media (max-width:640px){#visio .haut{flex-wrap:wrap;row-gap:8px}#visio .zoom{order:5;flex:1 0 100%;justify-content:center}#visio .ajuste{height:34px;padding:0 11px}}
/* le bouton Agrandir sur la ligne du titre */
.tete-grand{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border:0;cursor:pointer;border-radius:min(var(--br,999px),999px);background:var(--bbg,#fff);color:var(--bfg,#111);font:600 13px var(--pf,"Figtree"),sans-serif;white-space:nowrap;transition:scale .2s}
.tete-grand:hover{scale:1.05}
.tete-grand svg{width:14px;height:14px}
.tete-bloc .compte+.tete-grand{margin-left:4px}
.page-travail.hab .bloc .tete-bloc{align-items:center}
/* survols lisibles */
.btn.verre:hover,.ap-heros .btn.verre:hover{background:#fff;color:#0a0d1c;border-color:#fff}
/* les étiquettes du haut des travaux : liseré argenté, sans ombre, plus d'air */
.page-travail.hab .ecrin .meta{gap:10px}
.page-travail.hab .ecrin .meta .puce{padding:7px 15px;background:rgba(30,32,42,.46);color:#fff;border:1px solid rgba(228,232,240,.8);box-shadow:none}
/* les logos un peu plus grands */
.ecrin .centre img.logo{max-height:clamp(130px,24vw,290px);max-width:min(84vw,720px)}
.page-travail.hab[data-s="boz"] .ecrin .centre img.logo{max-height:clamp(110px,20vw,240px);max-width:min(80vw,640px)}
/* le petit badge Master 2 n'est plus coupé */
.legende small i,.diap .meta i,.ep-txt small i{display:inline-block;line-height:1.35;padding:1px 7px;vertical-align:1px}
.diap .meta{padding:3px 2px;line-height:1.75}
.vignette .legende small{padding:3px 1px 4px;overflow:visible}
/* le contour du survol n'est plus coupé en haut */
.piste{padding-top:20px;margin-top:-8px}
.cartes-etapes{padding-top:16px;margin-top:-8px}
.defile{padding-top:14px;margin-top:-8px}
.diap.on{box-shadow:0 0 0 3px rgba(255,255,255,.92),0 26px 40px -18px rgba(0,0,0,.8)}
/* les points du carrousel, façon Disney+ */
.points{gap:0;align-items:center}
.points button{width:16px;transition:width .35s cubic-bezier(.2,.8,.2,1);position:relative}
.points button.on{width:48px}
.points button::before,.points button.on::before{width:7px;height:7px;transform:none;background:rgba(255,255,255,.36);transition:width .35s cubic-bezier(.2,.8,.2,1),border-radius .35s}
.points button.on::before{width:36px;border-radius:999px}
.points button.on::after{content:"";position:absolute;left:6px;top:50%;width:36px;height:7px;margin-top:-3.5px;border-radius:999px;background:#fff;transform-origin:left center;transform:scaleX(var(--p,0))}
.ap-heros{margin-top:clamp(18px,2vw,28px)}

/* Les mondes façon Disney+ : collections, playlists, marques. */
.monde{position:relative;min-height:min(76vh,700px);display:flex;align-items:center;gap:clamp(24px,5vw,72px);padding:calc(var(--barre) + 44px) var(--g) 60px;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,var(--a),var(--fond) 80%)}
.m-fond{position:absolute;inset:-36px;z-index:-2;background-size:cover;background-position:center;filter:blur(9px) saturate(1.15);opacity:.7}
.monde::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,9,26,.88),rgba(6,9,26,.42) 60%,rgba(6,9,26,.1)),linear-gradient(0deg,var(--fond),transparent 44%)}
.m-texte{flex:1;min-width:0;max-width:680px}
.m-texte>small{display:block;font:700 12px "Sora";letter-spacing:.22em;text-transform:uppercase;color:#fff;opacity:.82;margin-bottom:16px}
.m-h{margin:0;font-size:0}.m-logo{display:block;max-width:min(520px,86%);max-height:210px;width:auto;height:auto;filter:drop-shadow(0 6px 26px rgba(0,0,0,.5))}
.m-nom{margin:0;font:800 clamp(32px,4.6vw,62px)/1.06 "Sora";color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.5)}
.m-tags{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}
.m-tags span{padding:6px 13px;border-radius:999px;font:600 13px "Sora";color:#fff;background:rgba(10,14,34,.5);border:1px solid rgba(226,232,244,.62)}
.m-texte p{margin:0 0 24px;font-size:clamp(16px,1.35vw,19px);line-height:1.55;color:#f1f3f9;max-width:60ch}
.m-btns{display:flex;flex-wrap:wrap;gap:12px}
.m-affiche{flex:none;width:clamp(210px,23vw,320px);border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.55);margin-left:auto}
.mur-posters .grille-affiches>*{flex:0 0 calc((100% - 100px)/6);max-width:none}@media (max-width:1100px){.mur-posters .grille-affiches>*{flex-basis:calc((100% - 60px)/4)}}@media (max-width:760px){.mur-posters .grille-affiches>*{flex-basis:calc((100% - 14px)/2)}}
.mur-posters{padding-top:12px}.mur-posters .grille-affiches{max-width:none;padding-left:0;padding-right:0;justify-content:flex-start}
@media (max-width:760px){.monde{flex-direction:column;align-items:flex-start;min-height:0;padding-bottom:40px}.m-affiche{width:52vw;margin:0;order:-1}.monde::after{background:linear-gradient(90deg,rgba(6,9,26,.72),rgba(6,9,26,.5)),linear-gradient(0deg,var(--fond),transparent 40%)}.m-logo{max-height:150px}}
/* La loupe et la recherche. */
#ouvrir-cherche{width:40px;height:40px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,color .22s,box-shadow .22s}
#ouvrir-cherche svg{width:19px;height:19px;stroke-width:2.4;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#ouvrir-cherche:hover,#ouvrir-cherche:focus-visible{background:#fff;color:#0b1330;transform:scale(1.1);box-shadow:0 0 0 4px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.35)}
#ouvrir-cherche:hover svg{transform:rotate(-14deg) scale(1.08)}
#decouvrir[hidden]{display:none}#decouvrir .rail-section,#decouvrir .apparait,#res-listes .rail-section,#res-listes .apparait{opacity:1;transform:none}#decouvrir,#res-listes{padding-top:6px}
.legal-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.legal-nav a{padding:8px 15px;border-radius:99px;border:1px solid rgba(255,255,255,.2);color:#e6e9f2;font-size:13.5px;font-weight:600;text-decoration:none;transition:background .2s}
.legal-nav a:hover{background:rgba(255,255,255,.1)}
.legal-nav a.on{background:#fff;color:#0b1020;border-color:#fff}
.tete .maj{font-size:13px;opacity:.75;margin-top:6px}
.texte.legal .bref{padding:18px 22px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);margin-bottom:12px}
.texte.legal .bref b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;color:#e8c77a}
.texte.legal .bref p{margin:0}
/* Liquid Glass : le fond passe à travers, flou et plus saturé, avec un reflet sur l'arête du haut */
.btn.glace,.btn.plein{color:#fff;border:1px solid rgba(255,255,255,.44);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.14);backdrop-filter:blur(18px) saturate(190%) brightness(1.14);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -1px 1px rgba(255,255,255,.2),inset 0 0 16px rgba(255,255,255,.13),0 14px 30px -12px rgba(0,0,0,.65);text-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s}
.btn.glace{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,rgba(255,255,255,.22))}
.btn.plein{color:#1c1405;text-shadow:none;background:linear-gradient(135deg,#f7dfa6,#e2be78 52%,#c8974a);border-color:rgba(255,240,205,.75)}
.btn.glace:hover,.btn.plein:hover{transform:translateY(-2px) scale(1.02);background-position:0 0;box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.3),inset 0 0 22px rgba(255,255,255,.2),0 18px 36px -12px rgba(0,0,0,.7)}
.btn.glace:hover{background:linear-gradient(135deg,rgba(255,255,255,.46),rgba(255,255,255,.18) 55%,rgba(255,255,255,.32))}
.btn.plein:hover{background:linear-gradient(135deg,#fcebbf,#ecca88 52%,#d6a557)}

/* 6 novembre : la barre en verre, liseré plus épais */
#barre,#barre.bas,body.sur-clair #barre{background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 42%,rgba(255,255,255,.13)),rgba(22,24,40,.26);border:0;box-shadow:0 14px 32px -12px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.2),inset 0 2px 1px -1px rgba(255,255,255,.6),inset 0 -2px 2px -1px rgba(255,255,255,.22),inset 0 0 16px rgba(255,255,255,.08)}
#barre::before{backdrop-filter:blur(22px) saturate(220%) brightness(.8);-webkit-backdrop-filter:blur(22px) saturate(220%) brightness(.8)}
#barre::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.95),rgba(255,255,255,.28) 26%,rgba(255,255,255,.7) 52%,rgba(255,255,255,.22) 76%,rgba(255,255,255,.9));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#barre .marque span,#menu a{text-shadow:0 1px 3px rgba(0,0,0,.5)}
#menu a svg,.rond svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
/* le pied de page reste au-dessus des fonds de travaux */
footer{position:relative;z-index:2;background:#0a0e24;color:#aab0c4}
body:has(.page-travail) footer{margin-top:0}
/* le sommaire de la consigne, cliquable */
.mission-d li{display:block;padding:0}
.mission-d li a{display:grid;grid-template-columns:42px 1fr 20px;gap:6px;align-items:center;padding:16px 10px;margin:0 -10px;border-radius:12px;color:inherit;transition:background .2s}
.mission-d li a:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.mission-d li .fl{display:grid;place-items:center;color:var(--acc);opacity:.4;transition:opacity .2s,transform .2s}
.mission-d li .fl svg{width:18px;height:18px}
.mission-d li a:hover .fl{opacity:1;transform:translateX(3px)}
/* les cartes de fin de page : image pleine, titre posé dessus */
.cartes-etapes,.cartes-etapes.peu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px;overflow:visible}
.carte-etape,.cartes-etapes.peu .carte-etape{display:block;position:relative;flex:none;max-width:none;aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:0;background:var(--p2);box-shadow:0 18px 30px -18px rgba(0,0,0,.45)}
.carte-etape .ce-im{position:absolute;inset:0;aspect-ratio:auto;left:0;right:0;bottom:0}
.carte-etape .ce-im .f{display:none}
.carte-etape .ce-im .n{inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.carte-etape::after{display:block;content:"";position:absolute;inset:38% 0 0;z-index:1;background:linear-gradient(0deg,rgba(6,8,20,.9),rgba(6,8,20,.55) 45%,transparent)}
.carte-etape .ce-tx{position:absolute;z-index:2;left:18px;right:18px;bottom:15px;padding:0;color:#fff}
.carte-etape .ce-tx b{font-family:var(--pf),"Sora",sans-serif;font-size:17px;color:#fff}
.carte-etape .ce-tx small{color:rgba(255,255,255,.84)}
.carte-etape:hover{transform:translateY(-5px);box-shadow:0 0 0 2.5px var(--acc),0 22px 34px -18px rgba(0,0,0,.5)}
.carte-etape:hover .n{transform:scale(1.05)}
/* la publicité de Zefil, fondue dans le décor */
.ecrin .fondu video.incruste{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.34;filter:blur(7px) saturate(1.15);mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(75% 85% at 50% 50%,#000 40%,transparent 100%);mask-image:radial-gradient(75% 85% at 50% 50%,#000 40%,transparent 100%)}
@media (prefers-reduced-motion:reduce){.ecrin .fondu video.incruste{display:none}}
/* Point actif : une cartouche toujours arrondie ; le blanc part d'un rond parfait et s'allonge, sans être étiré */
.points button.on::after{left:6px;width:calc(7px + 29px*var(--p,0));transform:none}
/* Collections, playlists, marques : un seul fond, du haut de la fenêtre (derrière la barre) jusqu'en bas de la page, sans rectangle */
.m-page{position:relative;isolation:isolate;margin-top:calc(var(--barre)*-1);overflow:clip;background:linear-gradient(180deg,color-mix(in srgb,var(--a) 70%,#060a1e) 0,color-mix(in srgb,var(--a) 46%,#060a1e) 46%,color-mix(in srgb,var(--b) 24%,#060a1e) 100%)}
.m-page>.m-fond{position:absolute;inset:-24px -24px auto;height:min(125vh,1180px);z-index:-2;background-size:cover;background-position:center 30%;filter:blur(10px) saturate(1.2) brightness(.78);opacity:.9;-webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,#000 52%,transparent 100%)}
.m-page::before{content:"";position:absolute;inset:0 0 auto;height:min(125vh,1180px);z-index:-1;background:linear-gradient(90deg,rgba(6,9,26,.8),rgba(6,9,26,.36) 60%,rgba(6,9,26,.08));-webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,#000 52%,transparent 100%)}
.m-page .monde{background:none;overflow:visible}
.m-page .monde::after{content:none}
body:has(.m-page) footer{margin-top:0}
@media (max-width:760px){.m-page::before{background:rgba(6,9,26,.56)}}
/* En-têtes centrés (collections, logiciels), comme les pages de travaux */
.monde.m-centre{justify-content:center;text-align:center}
.monde.m-centre .m-texte{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

/* La lentille : une seule pastille de verre qui glisse d'un onglet à l'autre, avec un petit rebond. */

#menu a{position:relative;z-index:1}
#menu a.actif,body.sur-clair #menu a.actif{background:none;box-shadow:none}

  #menu{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));height:62px;padding:4px;z-index:50;border:0;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 45%,rgba(255,255,255,.1)),rgba(20,22,32,.3);-webkit-backdrop-filter:blur(14px) saturate(190%) brightness(.74);backdrop-filter:blur(14px) saturate(190%) brightness(.74);box-shadow:0 16px 34px -12px rgba(0,0,0,.62),0 2px 8px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.14),inset 0 0 18px rgba(255,255,255,.07)}
  #menu::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.8),rgba(255,255,255,.16) 28%,rgba(255,255,255,.5) 54%,rgba(255,255,255,.12) 78%,rgba(255,255,255,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.pc-heros{position:relative;text-align:center;max-width:1000px;margin:0 auto;padding:clamp(130px,16vh,190px) var(--g) clamp(36px,5vw,60px)}
.pc-heros h1{font-size:clamp(50px,8.6vw,122px);line-height:1;letter-spacing:-.035em;font-weight:700;margin:0 0 24px;color:#fff}
.pc-heros .pa-chapo{margin-inline:auto}
.pc-pap{position:absolute;right:4%;top:18%;width:clamp(70px,10vw,130px);animation:pa-vole 6s ease-in-out infinite alternate;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.pc-direct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1280px;margin:0 auto;padding:0 var(--g)}
.pc-direct article{padding:clamp(26px,3vw,40px)}
.pc-ico{display:grid;place-items:center;width:56px;height:56px;border-radius:17px;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 80%,#fff),var(--rc));box-shadow:0 12px 24px -12px var(--rc);margin-bottom:22px}
.pc-ico svg{width:27px;height:27px}
.pc-direct small{display:block;font-size:14px;color:var(--doux2);margin-bottom:6px}
.pc-direct .valeur{display:block;font-size:clamp(23px,2.6vw,36px);font-weight:600;letter-spacing:-.015em;color:#fff;margin-bottom:24px;overflow-wrap:anywhere}
.pc-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:880px;margin:0 auto;padding:clamp(22px,3vw,38px)}
.pc-form label{display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-form .large{grid-column:1/-1}
.pc-form span{font-size:14px;font-weight:600;color:var(--doux2)}
.pc-form input,.pc-form select,.pc-form textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:#fff;background:rgba(6,10,28,.5);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:13px 15px;outline:0;transition:border-color .2s,box-shadow .2s;resize:vertical}
.pc-form select option{color:#111}
.pc-form input::placeholder,.pc-form textarea::placeholder{color:rgba(238,242,250,.42)}
.pc-form input:focus,.pc-form select:focus,.pc-form textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(226,190,120,.2)}
.pc-reseaux{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pc-reseaux a{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:24px 22px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);color:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.pc-reseaux a:hover{transform:translateY(-5px);border-color:var(--rc);box-shadow:0 22px 44px -22px var(--rc)}
.pc-app{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:var(--rc);color:var(--rf);margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pc-app svg{width:32px;height:32px}
.pc-reseaux b{font-size:20px}
.pc-reseaux small{font-size:14.5px;line-height:1.45;color:var(--doux2)}
.pc-reseaux .fl{position:absolute;right:20px;top:24px;width:18px;height:18px;color:var(--doux2);transition:transform .3s}
.pc-reseaux a:hover .fl{transform:translateX(4px);color:#fff}
.pc .qui{max-width:1000px;margin-inline:auto}
.pc .reponse{max-width:1000px;margin-inline:auto}
@media (max-width:1000px){.pa-methode{grid-template-columns:repeat(2,minmax(0,1fr))}.pa-methode li:last-child{grid-column:1/-1}.pc-reseaux{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.pa-heros{grid-template-columns:minmax(0,1fr);text-align:center;padding-top:100px;min-height:0}.pa-portrait{order:-1;width:min(250px,62vw)}.pa-chapo{margin-inline:auto}.pa-puces,.pa-btns,.pa-heros .reseaux{justify-content:center}.pa-bento{grid-template-columns:minmax(0,1fr)}.pa-bento article,.pa-bento article.large{grid-column:auto}.pa-chiffres{grid-template-columns:repeat(2,minmax(0,1fr))}.pa-etapes-s{grid-template-columns:minmax(0,1fr)}.pa-titre.gauche{position:static;text-align:center}.pa-titre.gauche p{margin-inline:auto}.pa-savoirs,.pc-direct{grid-template-columns:minmax(0,1fr)}.pc-pap{top:9%;right:2%}.pc-form{grid-template-columns:minmax(0,1fr)}.pa-fin{padding-bottom:130px}}
@media (max-width:520px){.pa-methode,.pc-reseaux{grid-template-columns:minmax(0,1fr)}.pa-methode li:last-child{grid-column:auto}}
@media (prefers-reduced-motion:reduce){.pa-aurore i,.pa-anneau,.pa-pap,.pc-pap{animation:none}.pa-manifeste span{color:#fff}}
.page>.pa:first-child{margin-top:calc(var(--barre)*-1)}
.pc .qui{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:1280px}
.pc .qui button{width:auto;min-width:0}
.pc .reponse{max-width:1280px}
@media (max-width:1000px){.pc .qui{grid-template-columns:repeat(2,minmax(0,1fr))}.pc .qui button:last-child{grid-column:1/-1}}
.pa-outils{display:flex;flex-wrap:wrap;justify-content:center}
.pa-outils a{width:112px}
.pa .holos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:none}
.pa .holo{width:auto;display:flex;flex-direction:column;height:auto;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);border-radius:26px;overflow:hidden}
.pa .holo img{position:static;width:100%;aspect-ratio:1;height:auto;object-fit:cover;display:block}
.pa .holo .cap{position:static;background:none;padding:16px 20px 20px;font-size:15px;line-height:1.45;color:var(--doux2)}
.pa .holo .cap b{display:block;font-size:18px;color:#fff;margin-bottom:4px}
@media (max-width:820px){.pa .holos{grid-template-columns:minmax(0,1fr)}}
/* le mur d'affiches des collections, des playlists et de Mon univers */
.mur-aff{position:absolute;left:0;right:0;top:0;height:min(112vh,1040px);overflow:hidden;z-index:-2;pointer-events:none}
.mur-in{position:absolute;left:-14%;right:-14%;top:-16%;bottom:-10%;display:flex;flex-direction:column;justify-content:center;gap:18px;transform:rotate(-7deg)}
.mur-rang{overflow:visible}
.mur-rang>div{display:flex;gap:18px;width:max-content;animation:mur-file var(--t,96s) linear infinite}
.mur-rang.inv>div{animation-direction:reverse}
.mur-rang img{height:clamp(230px,33vh,340px);aspect-ratio:2/3;object-fit:cover;border-radius:16px;flex:none}
@keyframes mur-file{to{transform:translateX(-50%)}}
.mur-aff::after{content:"";position:absolute;inset:0;background:radial-gradient(62% 56% at 50% 44%,color-mix(in srgb,var(--a,#0d2a6b) 34%,rgba(6,10,30,.94)) 0,color-mix(in srgb,var(--a,#0d2a6b) 30%,rgba(6,10,30,.72)) 55%,color-mix(in srgb,var(--b,#1f7a8c) 26%,rgba(6,10,30,.46)) 100%),linear-gradient(180deg,rgba(6,10,30,.5) 0,transparent 22%,transparent 62%,var(--fin,#0a0f2a) 100%)}
.m-page.a-mur{--fin:color-mix(in srgb,var(--a) 46%,#060a1e)}
.m-page.a-mur::before{content:none}
.m-page.a-mur .monde{min-height:min(84vh,780px)}
.m-page.a-mur .monde:not(.m-centre) .m-texte{max-width:680px}
.u-heros{position:relative;isolation:isolate;margin-top:calc(var(--barre)*-1);min-height:min(100vh,860px);display:flex;align-items:center;justify-content:center;padding:calc(var(--barre) + 56px) var(--g) 70px;text-align:center;--a:#3a1c71;--b:#c9892f;--fin:var(--fond,#0a0f2a)}
.u-heros.court{min-height:min(62vh,560px)}
.u-heros .mur-aff{height:100%}
.u-txt{position:relative;max-width:860px;display:flex;flex-direction:column;align-items:center}
.u-txt h1{font-size:clamp(52px,9vw,128px);line-height:1;letter-spacing:-.035em;font-weight:700;margin:22px 0 20px;background:linear-gradient(100deg,#fff 30%,#f3dfae 62%,#e2be78);-webkit-background-clip:text;background-clip:text;color:transparent}
.u-txt p{font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:#dbe2f2;max-width:640px;margin:0 0 26px}
.u-txt .puces{justify-content:center}
.u-groupe{padding:clamp(46px,6vw,84px) var(--g) 6px}
.u-groupe h2{font-size:clamp(32px,4.4vw,58px);line-height:1.05;letter-spacing:-.025em;margin:0 0 10px;color:#fff}
.u-groupe p{font-size:17px;color:#b9c4da;margin:0;max-width:620px}
@media (max-width:760px){.mur-rang img{height:190px}.m-page.a-mur .monde{min-height:0}}
@media (prefers-reduced-motion:reduce){.mur-rang>div{animation:none}}
.mur-aff{height:min(90vh,830px)}
.mur-aff::after{background:linear-gradient(180deg,rgba(6,10,30,.42) 0,transparent 20%,transparent 58%,var(--fin,#0a0f2a) 100%),radial-gradient(60% 58% at 50% 46%,color-mix(in srgb,var(--a,#0d2a6b) 26%,rgba(6,10,30,.95)) 0,color-mix(in srgb,var(--a,#0d2a6b) 30%,rgba(6,10,30,.8)) 60%,color-mix(in srgb,var(--b,#1f7a8c) 22%,rgba(6,10,30,.56)) 100%)}
.m-page.a-mur:not(:has(.m-centre)) .mur-aff::after{background:linear-gradient(180deg,rgba(6,10,30,.42) 0,transparent 20%,transparent 58%,var(--fin,#0a0f2a) 100%),linear-gradient(90deg,rgba(6,10,30,.9) 0,color-mix(in srgb,var(--a) 22%,rgba(6,10,30,.82)) 52%,color-mix(in srgb,var(--a) 34%,rgba(6,10,30,.56)) 100%)}
.u-heros{--fin:#0d1230}
.m-page.a-mur{--fin:color-mix(in srgb,var(--a) 66%,#060a1e)}
.u-heros .mur-aff{height:100%}
@media (max-width:820px){.pc-direct .valeur{font-size:min(23px,5.5vw)}.pc-pap{top:auto;bottom:-6px;right:6px;width:58px}.pc-heros{padding-bottom:58px}
  .m-page.a-mur .mur-aff::after{background:linear-gradient(180deg,transparent 0,transparent 58%,var(--fin,#0a0f2a) 100%),linear-gradient(0deg,color-mix(in srgb,var(--a,#0d2a6b) 26%,rgba(6,10,30,.84)),color-mix(in srgb,var(--a,#0d2a6b) 26%,rgba(6,10,30,.84)))}}

/* v14 : bouton « Voir en grand » des rangées */
.titre-rangee .rg-outils{display:flex;align-items:center;gap:14px;flex:none}
.voir-grand{display:inline-flex;align-items:center;gap:7px;font:600 13px/1 inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s}
.voir-grand:hover{background:rgba(255,255,255,.2)}
.voir-grand svg{width:15px;height:15px}
body.clair .voir-grand,.page-travail.hab .voir-grand{color:var(--texte,#fff)}
@media (max-width:600px){.voir-grand{font-size:0;gap:0;padding:8px}.voir-grand svg{width:17px;height:17px}}
/* v14 : le mémoire sans logo, un titre en Guigui Clean Display ; logo de l'Audit plus discret */
.ecrin .titre-memoire{font-family:"Guigui Clean Display",Montserrat,sans-serif;font-weight:900;font-size:clamp(54px,8.4vw,128px);line-height:.95;letter-spacing:-.02em;margin:0;color:#fff;text-shadow:0 10px 40px rgba(20,0,40,.55)}
.ecrin .titre-memoire small{display:block;font-weight:500;font-size:clamp(17px,1.7vw,26px);letter-spacing:.04em;margin-top:14px;color:#f1d48a}
.page-travail[data-s="audit-juridique"] .ecrin .centre img.logo{max-height:clamp(150px,22vw,250px)}
/* v14 : logos ramenés aux tailles des versions 6 à 9 (la v13 les avait trop agrandis), écart modéré avant les pastilles */
@media (min-width:821px){.page-travail .ecrin .centre .meta{margin-top:14px}}
/* v14 : l'écran d'ouverture fait exactement la hauteur visible, sur tout écran (iPhone, iPad, MacBook, iMac 24 pouces) */
.ecrin,.page-travail.hab .ecrin{min-height:max(520px,100vh);min-height:max(520px,100svh)}
/* v14 : la vidéo de Kithara (le diaporama qui défile) passe au second plan, sinon son texte se mélange au logo */
.page-travail[data-s="kithara"] .ecrin .fondu video{filter:brightness(.42) blur(5px) saturate(1.1);transform:scale(1.06)}

/* v13 : une carte du carrousel ne peut plus être élargie ou rétrécie par son contenu (vidéo, motifs) */
.piste-heros>.diap{min-width:0;max-width:calc(100% - 2*var(--hpeek))}

/* v14 : les deux réglages du lecteur prennent toute la fenêtre visible, sans bande vide à droite */
#lecteur.l-largeur,#lecteur.l-hauteur{padding:0}
#lecteur.l-largeur .fen,#lecteur.l-hauteur .fen{width:100%;height:100%;max-height:none;border-radius:0;border:0}
#lecteur.l-largeur .texte{padding-left:clamp(20px,3vw,56px);padding-right:clamp(20px,3vw,56px)}
#lecteur.l-largeur .texte>*{max-width:none}
/* v14 : le lecteur remplit vraiment la fenêtre (l'ancienne règle .texte des pages légales le bridait à 900 px) */
#lecteur .texte{max-width:none}
#lecteur.l-largeur .texte{font-size:clamp(18px,1.12vw,24px)}
#lecteur.l-largeur .texte img,#lecteur.l-largeur .texte figure,#lecteur.l-largeur .texte video{width:100%;max-width:none;height:auto}
#lecteur.l-largeur .texte p,#lecteur.l-largeur .texte li,#lecteur.l-largeur .texte header p{font-size:clamp(18px,1.25vw,22px)}
#lecteur.l-hauteur .texte>*{max-width:min(1400px,100%)}
#lecteur.l-hauteur .texte img{display:block;width:auto;max-width:100%;max-height:calc(100svh - 110px);margin-left:auto;margin-right:auto}
/* v14 : le mode lecture occupe tout l'écran, colonne large et bien centrée */
#lecteur.l-lecture .corps{justify-content:center}
#lecteur.l-lecture .texte{width:100%;padding-left:clamp(20px,5vw,90px);padding-right:clamp(20px,5vw,90px);font-size:calc(clamp(19px,1.3vw,28px)*var(--lz,1))}
#lecteur.l-lecture .texte>*{max-width:min(1500px,100%)}
#lecteur.l-lecture .texte img{width:100%;height:auto;border-radius:10px}

/* v14 : les sites personnels */
.sites-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:22px;padding:10px var(--g) 40px}
.site-carte{position:relative;display:flex;flex-direction:column;border-radius:var(--rayon);overflow:hidden;background:rgba(255,255,255,.05);box-shadow:var(--ombre);text-decoration:none;color:inherit;transition:transform .3s,box-shadow .3s;outline:2px solid transparent;outline-offset:-2px}
.site-carte:hover,.site-carte:focus-visible{transform:translateY(-4px);outline-color:rgba(255,255,255,.85)}
.site-carte .apercu{aspect-ratio:16/10;background-size:cover;background-position:top center}
.site-carte .txt{padding:16px 18px 20px}.site-carte h3{margin:6px 0 6px;font-size:20px}.site-carte p{margin:0;opacity:.78;font-size:15px;line-height:1.5}
.badge-perso{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(232,199,122,.16);color:#e8c77a;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.site-page{padding:8px var(--g) 30px}
.site-page .avert{display:flex;gap:14px;align-items:flex-start;max-width:980px;margin:14px 0 18px;padding:14px 18px;border-radius:18px;background:rgba(232,199,122,.10);border:1px solid rgba(232,199,122,.3);font-size:15px;line-height:1.55}
.site-page .actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.site-cadre{width:100%;height:calc(100svh - 120px);min-height:520px;border:0;border-radius:22px;background:#fff;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
@media (max-width:720px){.site-cadre{height:calc(100svh - 90px);border-radius:16px}}
</style>

function defilement(p){

    const max=p.scrollWidth-p.clientWidth;if(max<=0)return;

/* Le carrousel : la carte du milieu, les deux voisines qui dépassent, un passage automatique de la gauche vers la droite toutes les six secondes.
   Deux copies à chaque bout rendent la boucle invisible. On peut aussi glisser au doigt, à la souris, ou cliquer sur une voisine. */
function animerHeros(){
  const zone=$("#heros"),piste=$(".piste-heros",zone);if(!piste)return;
  const vrais=$$(".diap",piste),n=vrais.length,pts=$$(".points button",zone);
  const copie=el=>{const c=el.cloneNode(true);c.classList.remove("on");c.setAttribute("aria-hidden","true");c.inert=true;return c};
  piste.prepend(...vrais.slice(-2).map(copie));piste.append(...vrais.slice(0,2).map(copie));
  const tout=$$(".diap",piste),DUREE=3500;let i=0,minut=0,dehors=true,ecoule=0;
  const pas=()=>tout[1].offsetLeft-tout[0].offsetLeft, base=()=>{const c=tout[i+2]||tout[0];return (zone.clientWidth-c.offsetWidth)/2-c.offsetLeft};
  const poser=(dx=0)=>{piste.style.transform=`translate3d(${base()+dx}px,0,0)`;tout.forEach((d,k)=>{d.classList.toggle("on",k===i+2);d.classList.toggle("loin",Math.abs(k-i-2)>2)});pts.forEach((b,k)=>b.classList.toggle("on",k===(i+n)%n));ecoule=0;zone.style.setProperty("--p",0)};
  const caler=()=>{if(i>=0&&i<n)return;i=(i+n)%n;piste.classList.add("sans");poser();void piste.offsetWidth;piste.classList.remove("sans")};
  const aller=d=>{caler();i+=d;poser()};
  const lancer=()=>{clearInterval(minut);if(document.body.classList.contains("v-sobre")||matchMedia("(prefers-reduced-motion: reduce)").matches)return;minut=setInterval(()=>{if(!dehors||document.hidden)return;ecoule+=50;zone.style.setProperty("--p",Math.min(1,ecoule/DUREE));if(ecoule>=DUREE)aller(1)},50)};
  piste.addEventListener("transitionend",e=>{if(e.target!==piste)return;caler();const c=tout[i+2];if(c){const r=c.getBoundingClientRect(),z=zone.getBoundingClientRect(),e2=(z.left+z.width/2)-(r.left+r.width/2);if(Math.abs(e2)>1){piste.classList.add("sans");poser();void piste.offsetWidth;piste.classList.remove("sans")}}});
  zone.addEventListener("mouseenter",()=>dehors=false);zone.addEventListener("mouseleave",()=>dehors=true);
  pts.forEach((b,k)=>b.onclick=()=>{caler();i=k;poser();lancer()});
  $(".fleche.g",zone).onclick=()=>{aller(-1);lancer()};$(".fleche.d",zone).onclick=()=>{aller(1);lancer()};
  /* glisser : au-delà de 60 pixels, on passe à la carte suivante ; un vrai glissement n'ouvre pas le lien */
  let x0=0,dx=0,actif=false,tire=false;
  piste.addEventListener("pointerdown",e=>{if(e.button)return;actif=true;tire=false;x0=e.clientX;dx=0});
  piste.addEventListener("pointermove",e=>{if(!actif)return;dx=e.clientX-x0;if(!tire&&Math.abs(dx)>8){tire=true;caler();piste.classList.add("sans")}if(tire)poser(dx)});
  const fin=()=>{if(!actif)return;actif=false;if(!tire)return;piste.classList.remove("sans");if(Math.abs(dx)>60)aller(dx<0?1:-1);else poser();lancer()};
  piste.addEventListener("pointerup",fin);piste.addEventListener("pointercancel",fin);piste.addEventListener("pointerleave",fin);
  piste.addEventListener("click",e=>{if(tire){e.preventDefault();e.stopPropagation();tire=false;return}
    const d=e.target.closest(".diap");if(d&&!d.classList.contains("on")){e.preventDefault();const k=tout.indexOf(d)-2-i;aller(k);lancer()}},true);
  addEventListener("resize",poser0);function poser0(){piste.classList.add("sans");poser();void piste.offsetWidth;piste.classList.remove("sans")}
  poser0();lancer();
  return()=>{clearInterval(minut);removeEventListener("resize",poser0)};
}

/* ---------- les effets de l'accueil et de Mon univers ---------- */
/* Les sections montent doucement à leur arrivée à l'écran. Sans IntersectionObserver, tout est visible tout de suite. */
let guetteur=null;
function apparition(racine){
  const el=$$(".apparait,.rail-section",racine);
  if(!("IntersectionObserver" in window)){el.forEach(x=>x.classList.add("vu"));return}
  guetteur?.disconnect();
  guetteur=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("vu");guetteur.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.04});
  el.forEach(x=>{x.classList.add("apparait");guetteur.observe(x)});
}
function animerVues(racine){
  // la boule
  $$(".boule",racine).forEach(b=>{const g=$(".globe",b),ims=$$("img",g),n=ims.length,R=Math.min(320,b.clientWidth*.38);
    ims.forEach((im,i)=>{const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),th=Math.PI*(3-Math.sqrt(5))*i;
      const lon=Math.atan2(Math.sin(th)*r,Math.cos(th)*r)*180/Math.PI,lat=Math.asin(y)*180/Math.PI;im.style.transform=`rotateY(${lon}deg) rotateX(${lat}deg) translateZ(${R}px)`});
    let ax=-12,ay=0,v=.12,tir=null;const f=()=>{if(!b.isConnected)return;if(!tir)ay+=v;g.style.transform=`rotateX(${ax}deg) rotateY(${ay}deg)`;requestAnimationFrame(f)};f();
    b.onpointerdown=e=>{tir={x:e.clientX,y:e.clientY,ax,ay};b.setPointerCapture(e.pointerId)};
    b.onpointermove=e=>{if(!tir)return;ay=tir.ay+(e.clientX-tir.x)*.3;ax=Math.max(-50,Math.min(50,tir.ax-(e.clientY-tir.y)*.3))};
    b.onpointerup=()=>tir=null;});
  // le tunnel
  $$(".tunnel",racine).forEach(tn=>{const ims=$$(".monde img",tn),pas=650;
    const maj=()=>{if(!tn.isConnected)return;const r=tn.getBoundingClientRect(),tot=tn.offsetHeight-innerHeight,pr=Math.min(1,Math.max(0,-r.top/Math.max(1,tot)));
      const z=pr*pas*(ims.length-1);
      ims.forEach((im,i)=>{const d=i*pas-z,ang=i*137.5*Math.PI/180,ex=Math.cos(ang)*Math.min(24,4+i*3),ey=Math.sin(ang)*Math.min(16,3+i*2);
        im.style.transform=`translate(-50%,-50%) translate3d(${ex}vw,${ey}vh,${-d}px)`;im.style.opacity=d<-250?0:Math.max(0,1-d/(pas*6));im.style.zIndex=1000-i})};
    maj();addEventListener("scroll",maj,{passive:true});addEventListener("resize",maj)});
  // les cartes holographiques
  $$(".holo,.affiche",racine).forEach(c=>{c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");c.style.setProperty("--ry",(x-.5)*16+"deg");c.style.setProperty("--rx",(.5-y)*16+"deg")};
    c.onpointerleave=()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
  // le livre
  $$(".livre",racine).forEach(l=>{const p=JSON.parse(l.dataset.pages),d=$(".double",l),c=$(".cpt",l);let i=0;const lar=innerWidth<720?1:2;
    $$("[data-l]",l).forEach(b=>b.onclick=()=>{i=Math.max(0,Math.min(p.length-1,i+(+b.dataset.l>0?lar:-lar)));
      d.innerHTML=`<img src="${p[i]}" alt="Page ${i+1}" data-g="${i}">${lar>1&&p[i+1]?`<img src="${p[i+1]}" alt="Page ${i+2}" data-g="${i+1}">`:""}`;
      d.classList.remove("tourne");void d.offsetWidth;d.classList.add("tourne");c.textContent=lar>1&&p[i+1]?`${i+1} et ${i+2} sur ${p.length}`:`${i+1} sur ${p.length}`})});
  // l'apparition au défilement
  apparition(racine);
  // l'accordéon au toucher
  $$(".accordeon",racine).forEach(a=>$$(":scope>a",a).forEach(x=>x.addEventListener("mouseenter",()=>{$$(":scope>a",a).forEach(y=>y.classList.toggle("on",y===x))})));
}

  if(sel)l=l.filter(p=>sel.some(s=>nomFichier(p).startsWith(`${src}-${s}.`)));return l};
const minuscule=s=>s.charAt(0).toLowerCase()+s.slice(1);
/* Sans fiche écrite à la main, la page se construit à partir des documents en haute définition. */
function blocsDe(t){
  const b=DOCS_[t.slug];if(b&&b.length)return b.some(x=>x.k==="article")?b.filter(x=>!/(document|dossier) d'origine/i.test(x.t)):b;
  const h=hd(t),srcs=[...new Set([...h.diapos,...h.pages].map(p=>nomFichier(p).split("-")[0]))];

  return l.length?l:(t.images.length?[{t:"Les images",k:"images",ims:t.images}]:[]);
}

function brief(t,bl=[]){

/* Le manifeste s'allume mot à mot, le fil des étapes se remplit, les chiffres comptent. */
function animerAPropos(){
  const mots=$$("#pa-manifeste span"),m=$("#pa-manifeste"),et=$("#pa-etapes"),fil=$(".pa-fil");
  const maj=()=>{const h=innerHeight;if(m){const r=m.getBoundingClientRect(),k=Math.min(1,Math.max(0,(h*.86-r.top)/(r.height+h*.3))),n=Math.round(k*mots.length);mots.forEach((w,i)=>w.classList.toggle("on",i<n))}
    if(et&&fil){const r=et.getBoundingClientRect();fil.style.setProperty("--k",Math.min(1,Math.max(0,(h*.62-r.top)/r.height)).toFixed(3))}};
  addEventListener("scroll",maj,{passive:true});maj();
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,v=el.dataset.compte,n=parseInt(v),s=v.replace(/\d+/,"");if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/1100),q=1-Math.pow(1-k,3);el.textContent=Math.round(n*q)+s;if(k<1)requestAnimationFrame(f)})(t0)}),{threshold:.6});
  $$("[data-compte]").forEach(x=>io.observe(x));
  return()=>{removeEventListener("scroll",maj);io.disconnect()}}

/* Les papillons : ceux des maquettes d'octobre, dans toutes leurs matières. Chacun bat des ailes : les deux moitiés du logo se resserrent et s'ouvrent. */
const PAP=["p3-06","p3-00","p3-02","p3-08","p3-03","p2-ch","g-or","A"].map(n=>{const i=new Image();i.src=`img/logo/papillons/${n}.webp`;return i});
function battre(x,im,X,Y,cap,s,ph){if(!im.complete||!im.naturalWidth)return;

  const b=Array.from({length:n},(_,k)=>{const a=k/n*6.283+Math.random()*.5;return{x:w/2,y:h/2,cap:a,v:520+Math.random()*420,s:34+Math.random()*58,ph:Math.random()*6.28,f:15+Math.random()*9,im:k%PAP.length,t:Math.random()*9,fin:1.7+Math.random()*1.1}});
