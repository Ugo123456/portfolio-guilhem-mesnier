/* ---------- la recherche ---------- */
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function chercher(q){const m=norm(q).split(/\s+/).filter(Boolean);
  const r=TRAVAUX.filter(t=>{const txt=norm([t.titre,t.sous,t.niveau,t.matiere,t.tags.join(" "),t.consigne,t.fait,COLLECTIONS.filter(c=>c.s.includes(t.slug)).map(c=>c.nom).join(" ")].join(" "));return m.every(x=>txt.includes(x))});
  $("#resultats").innerHTML=q?(r.length?r.map(t=>tuile(t)).join(""):`<p class="chapeau">Aucun travail pour « ${echap(q)} ».</p>`):""}
function ouvrirCherche(q=""){$("#cherche").classList.add("on");$("#q").value=q;chercher(q);setTimeout(()=>$("#q").focus(),50);
  $("#sugg").innerHTML=["Identité de marque","Secteur public","Affiche","Newsletter","Audit","Analyse","Vidéo","Communication interne"].map(s=>`<button>${s}</button>`).join("");
  $$("#sugg button").forEach(b=>b.onclick=()=>{$("#q").value=b.textContent;chercher(b.textContent)})}
$("#ouvrir-cherche").onclick=()=>ouvrirCherche();
$("#fermer-cherche").onclick=()=>$("#cherche").classList.remove("on");
$("#q").oninput=e=>chercher(e.target.value);
$("#resultats").addEventListener("click",e=>{if(e.target.closest("a"))$("#cherche").classList.remove("on")});

/* ---------- la visionneuse ---------- */
/* Une fenêtre flottante, pas un plein écran : les flèches pour avancer, le plein écran sur demande. */
const V={ims:[],i:0,mode:"",titre:""}, visio=$("#visio"), fen=$("#visio .fenetre");
function ouvrirVisio(titre,ims,mode="",i=0){
  if(!ims.length)return;
  Object.assign(V,{ims,mode,titre,i:0});
  visio.className="on "+mode;
  $("#visio .titre b").textContent=titre;
  const mini=$("#visio .miniatures");
  mini.innerHTML=ims.length>1?ims.map((s,j)=>`<button aria-label="Aller à ${j+1}" data-m="${j}"><img src="${s}" alt="" loading="lazy"></button>`).join(""):"";
  document.documentElement.classList.add("fige");
  montrer(i);
}
function montrer(n){
  V.i=Math.max(0,Math.min(V.ims.length-1,n));
  const im=$("#visio .scene img");im.style.opacity=0;
  im.onload=()=>{im.style.opacity=1};im.src=V.ims[V.i];im.alt=`${V.titre}, ${V.i+1} sur ${V.ims.length}`;
  if(im.complete)im.style.opacity=1;
  $("#visio .scene").scrollTop=0;
  $("#visio .titre small").textContent=V.ims.length>1?`${V.i+1} sur ${V.ims.length}`:"";
  $("#visio .fl.g").disabled=V.i===0;$("#visio .fl.d").disabled=V.i===V.ims.length-1;
  $$("#visio .miniatures button").forEach((b,j)=>b.classList.toggle("on",j===V.i));
  $(`#visio .miniatures button[data-m="${V.i}"]`)?.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  // l'image suivante est chargée d'avance
  if(V.ims[V.i+1])new Image().src=V.ims[V.i+1];
}
function fermerVisio(){
  if(document.fullscreenElement)document.exitFullscreen?.();
  visio.className="";document.documentElement.classList.remove("fige");$("#visio .scene img").removeAttribute("src");
}
$("#visio .x").onclick=fermerVisio;
$("#visio .voile").onclick=fermerVisio;
$("#visio .fl.g").onclick=()=>montrer(V.i-1);
$("#visio .fl.d").onclick=()=>montrer(V.i+1);
$("#visio .miniatures").onclick=e=>{const b=e.target.closest("[data-m]");if(b)montrer(+b.dataset.m)};
$("#visio .plein-ecran").onclick=()=>{document.fullscreenElement?document.exitFullscreen():fen.requestFullscreen?.()};
// pas de défilement au trackpad dans la fenêtre, sauf pour les documents qui se lisent de haut en bas
visio.addEventListener("wheel",e=>{if(!visio.classList.contains("long"))e.preventDefault()},{passive:false});
// le glissement du doigt sur téléphone
let x0=null;
$("#visio .scene").addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
$("#visio .scene").addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)montrer(V.i+(dx<0?1:-1))},{passive:true});
document.addEventListener("click",e=>{
  if(e.target.closest("#visio"))return;
  // les galeries de la page d'un travail
  const g=e.target.closest("[data-gal]");
  if(g&&GALS[g.dataset.gal]){e.preventDefault();const G=GALS[g.dataset.gal];ouvrirVisio(G.titre,G.ims,G.mode,+g.dataset.i||0);return}
  // les ancres internes (sommaire d'un document, boutons du haut)
  const a=e.target.closest("[data-aller]");
  if(a){e.preventDefault();document.getElementById(a.dataset.aller)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  // un document long se déplie
  const d=e.target.closest("[data-lire]");
  if(d){e.preventDefault();ouvrirLecteur(d.dataset.lire,d.dataset.c);return}
  const lc=e.target.closest("[data-lc]");
  if(lc){e.preventDefault();$("#lecteur .texte").scrollTo({top:$("#"+lc.dataset.lc).offsetTop-24,behavior:"smooth"});return}
  if(e.target.closest("#lecteur .x")||e.target.matches("#lecteur .voile")){fermerLecteur();return}
  // une vidéo YouTube ne se charge qu'au clic
  const y=e.target.closest("[data-yt]");
  if(y&&location.protocol==="file:"){open("https://www.youtube.com/watch?v="+y.dataset.yt,"_blank","noopener");return}
  if(y&&!y.querySelector("iframe")){y.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${y.dataset.yt}?autoplay=1&rel=0" title="Vidéo YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;return}
  // le repli des autres pages (cartes de Mon univers, tunnel de l'accueil)
  const el=e.target.closest("[data-g]");
  if(el){const zone=el.closest(".section,.tunnel,section")||document;
    const ims=[...new Set($$("img[data-g]",zone).map(i=>i.getAttribute("src")))];
    e.preventDefault();ouvrirVisio(zone.querySelector("h2,h1")?.textContent||"Image",ims,"",+el.dataset.g||0)}
});
function ouvrirLecteur(slug,chap){
  const L=LECT[slug];if(!L)return;const el=$("#lecteur");el.setAttribute("style",habStyle(slug));
  $("#lecteur .l-titre").innerHTML=`<small>${echap(L.genre)}</small><b>${echap(L.titre)}</b>`;
  $("#lecteur nav").innerHTML=L.som.map(([a,x],i)=>`<a href="#" data-lc="${a}"><span>${i+1}</span>${echap(x)}</a>`).join("");
  $("#lecteur nav").style.display=L.som.length>1?"":"none";
  const T=$("#lecteur .texte");T.innerHTML=`<header><h1>${echap(L.titre)}</h1><p>${echap(L.sous)}</p></header>${L.html}<footer><button class="btn verre x-bas" data-fin>Fermer le document</button></footer>`;
  el.classList.add("ouvert");document.documentElement.style.overflow="hidden";T.scrollTop=0;
  if(chap)requestAnimationFrame(()=>{const c=$("#"+chap);if(c)T.scrollTop=c.offsetTop-24});
  const barre=$("#lecteur .prog i"),liens=$$("#lecteur nav a");
  T.onscroll=()=>{barre.style.width=(T.scrollTop/Math.max(1,T.scrollHeight-T.clientHeight)*100)+"%";
    let act=0;L.som.forEach(([a],i)=>{const h=document.getElementById(a);if(h&&h.offsetTop-90<=T.scrollTop)act=i});liens.forEach((l,i)=>l.classList.toggle("actif",i===act))};
  T.onscroll();T.querySelector("[data-fin]").onclick=fermerLecteur;
}
function fermerLecteur(){$("#lecteur").classList.remove("ouvert");document.documentElement.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#lecteur.ouvert")&&!$("#visio.on"))fermerLecteur()});
document.addEventListener("keydown",e=>{
  if(visio.classList.contains("on")){
    if(e.key==="Escape"&&!document.fullscreenElement)fermerVisio();
    if(e.key==="ArrowLeft"){e.preventDefault();montrer(V.i-1)}
    if(e.key==="ArrowRight"){e.preventDefault();montrer(V.i+1)}
    return}
  if((e.key==="Enter"||e.key===" ")&&document.activeElement?.matches("[data-gal][role=button]")){e.preventDefault();document.activeElement.click();return}
  if(e.key==="Escape")$("#cherche").classList.remove("on");
  else if(e.key==="/"&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();ouvrirCherche()}});

/* ---------- la navigation ---------- */
const MENU=[["#/","Accueil",I.maison],["#/travaux","Mes travaux",I.grille,"Travaux"],["#/collections","Collections",I.pile],["#/univers","Mon univers",I.etoile,"Univers"],["#/a-propos","À propos",I.boussole],["#/contact","Contact",I.bulle]];
$("#menu").innerHTML=MENU.map(([h,n,i,c])=>`<a href="${h}" aria-label="${n}">${i}<span class="long">${n}</span><span class="court">${c||n}</span></a>`).join("");
const VERSIONS=[["","Complète"],["sobre","Sans carrousel"],["pro","Plus professionnelle"],["effets","Plus d'effets"]];
function pied(){return `<footer><nav aria-label="Pied de page">${MENU.map(([h,n])=>`<a href="${h}">${n}</a>`).join("")}<a href="#/plan">Plan du site</a><a href="#/mentions">Mentions légales</a><a href="#/confidentialite">Confidentialité</a><a href="#/conditions">Conditions d'utilisation</a><a href="#/cookies">Cookies</a></nav>
  <div class="ver">Version : ${VERSIONS.map(([v,n])=>`<button data-v="${v}" class="${(document.body.dataset.v||"")===v?"on":""}">${n}</button>`).join("")}</div>
  <p class="mention">© 2026 Guilhem Mesnier. Portfolio personnel. ${echap(MENTION)}</p></footer>`}
function version(v){document.body.classList.remove("v-sobre","v-pro","v-effets");if(v)document.body.classList.add("v-"+v);document.body.dataset.v=v||"";
  const u=new URL(location.href);v?u.searchParams.set("v",v):u.searchParams.delete("v");history.replaceState(null,"",u);route()}
version.init=()=>{const v=new URLSearchParams(location.search).get("v")||"";if(v){document.body.classList.add("v-"+v);document.body.dataset.v=v}};

let arret=null;
function route(){
  arret?.();arret=null;
  const h=location.hash.replace(/^#/,"")||"/", [,a,b]=h.split("/");
  let html="";
  volant.on(!a);
  document.title="Guilhem Mesnier, portfolio de communication numérique";
  if(!a)html=pageAccueil();
  else if(a==="t"&&parSlug[b])html=pageTravail(parSlug[b]);
  else if(a==="travaux")html=pageTravaux(b||"");
  else if(a==="collections")html=pageCollections();
  else if(a==="collection"){const c=COLLECTIONS.find(c=>c.id===b)||COLLECTIONS[0];html=pageListe(c.nom,c.d,liste(c.s),c.c)}
  else if(a==="playlist"){const p=PLAYLISTS.find(p=>p.id===b)||PLAYLISTS[0];html=pagePlaylist(p)}
  else if(a==="marque"){const m=MARQUES.find(m=>m.id===b);html=m?pageListe(m.nom,`Tous les travaux : ${m.nom}.`,TRAVAUX.filter(m.f)):pageAccueil()}
  else if(a==="univers")html=pageUnivers(b||"");
  else if(a==="a-propos")html=pageAPropos();
  else if(a==="contact")html=pageContact();
  else if(a==="plan")html=pagePlan();
  else if(a==="chercher"){html=pageAccueil();setTimeout(()=>ouvrirCherche(decodeURIComponent(b||"")),0)}
  else if(LEGAL[a])html=pageLegale(a);
  else html=pageAccueil();
  $("#app").innerHTML=`<div class="${a==="t"||!a?"":"page"}">${html}</div>`+pied();
  document.body.classList.toggle("sur-clair",!!$(".hab-clair"));
  const actif=!a?"#/":a==="t"||a==="travaux"||a==="marque"?"#/travaux":a==="collection"||a==="collections"||a==="playlist"?"#/collections":"#/"+a;
  $$("#menu a").forEach(x=>x.classList.toggle("actif",x.getAttribute("href")===actif));
  $("#menu").classList.remove("ouvert");
  if(!a)arret=animerHeros();
  if(a==="travaux"){remplirTravaux(b||"");$$("#filtres button").forEach(x=>x.onclick=()=>remplirTravaux(x.dataset.f))}
  if(a==="contact")$$(".qui button").forEach(x=>x.onclick=()=>{$$(".qui button").forEach(y=>y.classList.toggle("on",y===x));$("#rep").textContent=QUI.find(q=>q[0]===x.dataset.q)[3]});
  $$("footer .ver button").forEach(x=>x.onclick=()=>version(x.dataset.v));
  brancherRails();animerVues($("#app"));
  scrollTo({top:0,behavior:"instant"});
}
addEventListener("hashchange",route);

/* les étoiles de la version « plus d'effets » */
(function(){const c=$("#etoiles"),x=c.getContext("2d");let p=[];const tail=()=>{c.width=innerWidth;c.height=innerHeight;p=Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,v:Math.random()*.25+.05}))};tail();addEventListener("resize",tail);
  (function f(){if(document.body.classList.contains("v-effets")){x.clearRect(0,0,c.width,c.height);p.forEach(s=>{s.y-=s.v;if(s.y<0)s.y=c.height;x.globalAlpha=.4+Math.random()*.4;x.fillStyle="#cfe9ff";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()})}requestAnimationFrame(f)})()})();

/* le mode clair ou sombre, gardé d'une visite à l'autre quand le navigateur le permet */
const MODE={lire(){try{return localStorage.getItem("gm-theme")}catch(_){return null}},
  poser(v){document.body.classList.toggle("clair",v==="clair");$("#theme").setAttribute("aria-label",v==="clair"?"Passer en mode sombre":"Passer en mode clair");try{localStorage.setItem("gm-theme",v)}catch(_){}}};
MODE.poser(MODE.lire()||"sombre");
$("#theme").onclick=()=>MODE.poser(document.body.classList.contains("clair")?"sombre":"clair");
/* la barre se fait plus dense dès qu'on descend */
const barreBas=()=>$("#barre").classList.toggle("bas",scrollY>40);addEventListener("scroll",barreBas,{passive:true});barreBas();
/* Les papillons : ceux des maquettes d'octobre, dans toutes leurs matières. Chacun bat des ailes : les deux moitiés du logo se resserrent et s'ouvrent. */
const PAP=["p3-06","p3-00","p3-02","p3-08","p3-03","p2-ch","g-or","A"].map(n=>{const i=new Image();i.src=`img/logo/papillons/${n}.webp`;return i});
function battre(x,im,X,Y,cap,s,ph){if(!im.complete||!im.naturalWidth)return;
  const fl=.22+.78*Math.abs(Math.cos(ph)),hw=im.naturalWidth/2,H=s*im.naturalHeight/im.naturalWidth;
  x.save();x.translate(X,Y);x.rotate(cap+Math.PI/2);
  x.drawImage(im,0,0,hw,im.naturalHeight,-s/2*fl,-H/2,s/2*fl,H);x.drawImage(im,hw,0,hw,im.naturalHeight,0,-H/2,s/2*fl,H);x.restore()}
const taille=c=>{const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=w*d;c.height=h*d}return{d,w,h}};
/* À l'ouverture : l'essaim jaillit du logo, s'éparpille dans la page en battant des ailes, puis se dissipe. */
function essaim(){const c=document.createElement("canvas");c.id="envol";document.body.appendChild(c);const x=c.getContext("2d"),{d,w,h}=taille(c),n=w<700?14:24;
  const b=Array.from({length:n},(_,k)=>{const a=k/n*6.283+Math.random()*.5;return{x:w/2,y:h/2,cap:a,v:520+Math.random()*420,s:34+Math.random()*58,ph:Math.random()*6.28,f:15+Math.random()*9,im:k%PAP.length,t:Math.random()*9,fin:1.7+Math.random()*1.1}});
  let t0=0,der=0;(function pas(now){t0=t0||now;const T=(now-t0)/1000,dt=Math.min(.05,(now-der)/1000||.016);der=now;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);let vivant=false;
    for(const p of b){if(T>p.fin)continue;vivant=true;p.cap+=Math.sin(now/230+p.t)*.045;const v=p.v*Math.max(.2,1-T/1.3);p.x+=Math.cos(p.cap)*v*dt;p.y+=Math.sin(p.cap)*v*dt;p.ph+=dt*p.f;
      x.globalAlpha=Math.min(1,T*8)*Math.min(1,(p.fin-T)/.5);battre(x,PAP[p.im],p.x,p.y,p.cap,p.s*Math.min(1,.45+T*2.2),p.ph)}
    x.globalAlpha=1;if(vivant&&T<3.2)requestAnimationFrame(pas);else c.remove()})(performance.now())}
/* Sur l'accueil : cinq papillons restent et volent lentement derrière la page ; ils tournent autour de la souris quand elle passe près d'eux. */
const volant=(function(){const c=$("#vol");if(!c||matchMedia("(prefers-reduced-motion: reduce)").matches)return{on(){}};
  const x=c.getContext("2d");let actif=false,der=0,souris={x:-999,y:-999};addEventListener("pointermove",e=>{souris={x:e.clientX,y:e.clientY}},{passive:true});
  const b=Array.from({length:innerWidth<700?3:5},(_,k)=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,cap:Math.random()*6.28,v:34+Math.random()*30,s:30+Math.random()*30,ph:Math.random()*6.28,f:6+Math.random()*4,im:(k*3+1)%PAP.length,t:Math.random()*99}));
  function pas(now){if(!actif)return;requestAnimationFrame(pas);if(document.hidden||now-der<30)return;const dt=Math.min(.06,(now-der)/1000);der=now;const{d,w,h}=taille(c);x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
    for(const p of b){const dx=souris.x-p.x,dy=souris.y-p.y,di=Math.hypot(dx,dy);let veut=p.cap+Math.sin(now/1300+p.t)*.6;if(di<280){const a=p.t+now/900;veut=Math.atan2(souris.y+Math.sin(a*1.3)*90-p.y,souris.x+Math.cos(a)*110-p.x)}
      p.cap+=(((veut-p.cap+Math.PI*3)%(Math.PI*2))-Math.PI)*.04;p.x+=Math.cos(p.cap)*p.v*dt;p.y+=Math.sin(p.cap)*p.v*dt;p.ph+=dt*p.f;
      if(p.x<-70)p.x=w+60;if(p.x>w+70)p.x=-60;if(p.y<-70)p.y=h+60;if(p.y>h+70)p.y=-60;battre(x,PAP[p.im],p.x,p.y,p.cap,p.s,p.ph)}}
  return{on(v){if(v===actif)return;actif=v;c.classList.toggle("on",v);if(v){der=performance.now();requestAnimationFrame(pas)}}}})();
/* l'ouverture : le papillon tourne pendant le chargement, puis l'essaim s'envole */
(function(){const c=$("#chargement");if(!c)return;
  const finir=()=>{if(c.classList.contains("fin"))return;c.classList.add("fin");
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)essaim();
    setTimeout(()=>c.remove(),1800)};
  if(document.readyState==="complete")setTimeout(finir,500);else addEventListener("load",()=>setTimeout(finir,350));
  setTimeout(finir,4500)})();
version.init();route();
</script>
